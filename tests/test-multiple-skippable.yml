name: Test multiple skippable jobs all skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          needs: '{"build":{"result":"success","outputs":{}},"optional-lint":{"result":"skipped","outputs":{}},"optional-docs":{"result":"skipped","outputs":{}}}'
          skippable: |
            optional-lint
            optional-docs
      - name: Assert action succeeded when all skippable jobs were skipped
        run: |
          echo "PASS: action completed successfully when all skippable jobs were skipped"
