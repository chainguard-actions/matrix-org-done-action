name: Test job failure detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          needs: '{"build":{"result":"success","outputs":{}},"lint":{"result":"failure","outputs":{}},"test":{"result":"success","outputs":{}}}'
      - name: Assert action failed when a job failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when a dependent job failed, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when a dependent job failed"
