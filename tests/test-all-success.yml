name: Test all jobs succeeded
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          needs: '{"build":{"result":"success","outputs":{}},"lint":{"result":"success","outputs":{}},"test":{"result":"success","outputs":{}}}'
      - name: Assert action succeeded
        run: |
          echo "PASS: action completed successfully when all jobs succeeded"
