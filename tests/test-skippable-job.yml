name: Test skippable job skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          needs: '{"build":{"result":"success","outputs":{}},"optional-lint":{"result":"skipped","outputs":{}}}'
          skippable: "optional-lint"
      - name: Assert action succeeded when skippable job was skipped
        run: |
          echo "PASS: action completed successfully when skippable job was skipped"
